<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080A">
<title>Hana Free Shop — Market • Të gjitha produktet</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/animations-100k.css">
<link rel="stylesheet" href="../css/fix-hero-100x.css">
<link rel="stylesheet" href="../css/super-huge-x100.css">
<link rel="stylesheet" href="../css/fix-glitch-100x.css">
<style>
.market-hero{padding:20px 16px 12px;max-width:1280px;margin:0 auto}
.market-title{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:700;letter-spacing:-.02em}
.market-sub{font-size:13px;color:var(--text-3);margin-top:6px}
.market-filters{position:sticky;top:calc(64px + 46px);z-index:20;background:rgba(8,8,10,.88);backdrop-filter:blur(px);border-bottom:1px solid rgba(255,255,255,.06);padding:14px 16px;margin-top:12px}
.filter-row{display:flex;gap:10px;align-items:center;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filter-row::-webkit-scrollbar{display:none}
.filter-chip{height:40px;padding:0px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);font-size:13px;font-weight:700;white-space:nowrap;transition:.22s;display:inline-flex;align-items:center;gap:6px;flex-shrink:0}
.filter-chip.active{background:var(--gold-gradient);color:#1A1200;border-color:transparent;box-shadow:0 4px 16px rgba(212,175,55,.3)}
.filter-chip:hover{transform:translateY(-1px)}
.market-grid-wrap{max-width:1280px;margin:0 auto;padding:16px}
.cat-circles{display:flex;gap:14px;overflow-x:auto;padding:12px 2px 16px;scroll-snap-type:x mandatory;scrollbar-width:none}
.cat-circles::-webkit-scrollbar{display:none}
.cat-circle{flex:0 0 88px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;transition:.24s}
.cat-circle .thumb{width:76px;height:76px;border-radius:50%;overflow:hidden;background:var(--bg-3);border:2px solid rgba(255,255,255,.08);padding:3px;transition:.24s;position:relative}
.cat-circle .thumb img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.cat-circle.active .thumb{border-color:var(--gold-400);box-shadow:0 0 0 4px rgba(212,175,55,.),0 8px 24px rgba(0,0,0,.4)}
.cat-circle:hover .thumb{transform:translateY(-2px) scale(1.03);border-color:rgba(232,198,122,.22)}
.cat-circle span{font-size:11px;font-weight:700;line-height:1.2;color:var(--text-2);max-width:88px}
.cat-circle.active span{color:var(--text-1)}
.cat-circle.all .thumb{background:var(--gold-gradient);display:grid;place-items:center;font-weight:800;color:#1A1200;font-size:12px;letter-spacing:.04em}
.search-sort{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap}
.search-sort .input{height:42px;flex:1;min-width:200px}
.sort-select{height:42px;padding:0 14px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#fff;font-size:13px;font-weight:600}

/* SUPER HUGE MARKET ANIMATIONS - ANOTHER LEVEL */
.market-hero{animation:fadeUp .8s ease both}
.market-grid .product-card{opacity:0;animation:fadeUp .6s ease forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.filter-chip{transition:all .22s var(--ease)}
.filter-chip:active{transform:scale(.96)}
.cat-circle{transition:all .24s var(--ease)}
.cat-circle:hover{transform:translateY(-3px)}
</style>
<script type="importmap">
{ "imports": { "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js", "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js", "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js" }
}
</script>
</head>
<body>
<div class="app" style="padding-bottom:calc(74px + env(safe-area-inset-bottom))"> <header class="header"> <div class="header-main"> <a href="/" class="logo"><div class="logo-mark">H</div><div class="logo-text"><strong>HANA</strong><span>FREE SHOP</span></div></a> <div class="location"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D4AF37" stroke-width="1.8"><path d="M12 21s-6-5.33-6-10a6 6 0 0 1 12 0c0 4.67-6 10-6 10z"/><circle cx="12" cy="11" r="2"/></svg><span>Pejë</span></div> <div class="header-actions"> <a href="/" class="btn btn-outline btn-sm">← Ballina</a> <button class="icon-btn cart-btn" id="cartBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 8h-3l-4 9hl-4-9h-3"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span class="badge gold" id="cartCount">0</span></button> </div> </div> </header> <div class="market-hero"> <h1 class="market-title">Market • Të gjitha produktet</h1> <p class="market-sub">Zgjidh kategorinë e parë me rrumbullaka • Pastaj filtro lehtë • Sistem shumë i lehtë profesional dhe funksional • +383 48 588 886</p> <div class="search-sort"> <input id="marketSearch" class="input" placeholder="Kërko puro, Golden Eagle, OCB, Bulldak, Ice Cups, Grey Goose, Jack..."> <select id="marketSort" class="sort-select"> <option value="default">Rendit: Default</option> <option value="price-low">Çmimi: Ulët → Lartë</option> <option value="price-high">Çmimi: Lartë → Ulët</option> <option value="name">Emri: A → Z</option> <option value="discount">Zbritja më e madhe</option> </select> </div> <div class="cat-circles" id="marketCats"> <!-- JS will fill --> </div> </div> <div class="market-filters"> <div class="filter-row" id="filterRow"> <button class="filter-chip active" data-filter="all">✨ Të gjitha</button> <button class="filter-chip" data-filter="ushqime">🍔 Ushqim</button> <button class="filter-chip" data-filter="pije">🥤 Pije</button> <button class="filter-chip" data-filter="embelsira">🍫 Ëmbëlsira</button> <button class="filter-chip" data-filter="alkool">🥃 Alkohol </button> <button class="filter-chip" data-filter="cigare">🚬 Cigare • OCB • Puro</button> <button class="filter-chip" data-filter="bulldak">🌶️ Bulldak • Noodles</button> <button class="filter-chip" data-filter="ice">🍦 Akullore • Ice Cups</button> <button class="filter-chip" data-filter="oferta">🔥 Oferta</button> </div> </div> <div class="market-grid-wrap"> <div class="product-grid" id="marketGrid"></div> <div class="empty-state" id="marketEmpty" style="display:none"> <div class="empty-icon">🔍</div> <h3>Nuk u gjet asnjë produkt</h3> <p>Provo një kategori tjetër</p> </div> </div> <nav class="bottom-nav"> <button class="bn-item" onclick="location.href='/'"><span class="bn-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V11l9-8z"/></svg></span><span>Ballina</span></button> <button class="bn-item active"><span class="bn-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span><span>Market</span></button> <button class="bn-item" onclick="document.getElementById('marketSearch').focus()"><span class="bn-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6"/><path d="M21 21l-4.3-4.3"/></svg></span><span>Kërko</span></button> <button class="bn-item" id="marketCartBtn"><span class="bn-icon cart-wrap"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 8h-3l-4 9hl-4-9h-3"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span class="bn-badge" id="bnCartCount">0</span></span><span>Shporta</span></button> <button class="bn-item" onclick="location.href='/'"><span class="bn-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span>Llogaria</span></button> </nav> <div class="drawer-backdrop" id="drawerBackdrop"></div> <aside class="drawer cart-drawer premium-cart" id="cartDrawer"> <div class="drawer-head premium-head"><div class="head-left"><div class="head-icon">🛒</div><div><h3>Shporta e Blerjeve</h3><span class="head-sub"><span id="cartDrawerCount">0 artikuj</span> • Dërgesa në Pejë</span></div></div><button class="icon-btn close-drawer">✕</button></div> <div class="drawer-body" id="cartBody"><div id="cartItems"></div><div id="cartTotalsPremium"></div></div> <div class="drawer-foot premium-foot"><button class="btn btn-gold full premium-checkout" onclick="location.href='/'">Vazhdo Blerjen →</button></div> </aside> <div class="toast-stack" id="toastStack"></div>
</div> <script type="module">
import { initFirebase, fetchProducts, fetchCategories, getLocalData } from '../js/firebase.js'; let PRODUCTS=[], CATEGORIES=[];
let activeCat='all';
let activeFilter='all';
let searchQ=''; const $ = s=>document.querySelector(s);
const $$ = s=>[...document.querySelectorAll(s)];
const LS_CART='hana_cart_v3';
let cart=[];
try{ cart=JSON.parse(localStorage.getItem(LS_CART)||'[]'); }catch{ cart=[]; }
function cartCount(){ return cart.reduce((s,i)=>s+i.qty,0); }
function updateCartUI(){ const c=cartCount(); const el=$('#cartCount'); const bn=$('#bnCartCount'); if(el){el.textContent=c; el.style.display=c>0?'grid':'none'} if(bn){bn.textContent=c; bn.style.display=c>0?'grid':'none'} }
function toast(msg){ const stack=$('#toastStack'); const el=document.createElement('div'); el.className='toast gold'; el.innerHTML=`<span class="t-icon">✓</span><span>${msg}</span>`; stack.appendChild(el); setTimeout(()=>el.remove(),3000); } const MARKET_CATS=[ {id:'all',name:'Të gjitha',icon:'✨',isAll:true}, {id:'ushqime-pije',name:'Ushqim',img:'../images/hero-buldak-ice.jpg'}, {id:'pije-tonike',name:'Pije',img:'../images/hero-premium-bag.jpg'}, {id:'cokollata-embelsira',name:'Ëmbëlsira',img:'../images/products/lindt-lindor-dark-200g.jpg'}, {id:'alkool',name:'Alkohol',img:'../images/hero-alcohol-variety.jpg'}, {id:'cigare',name:'Cigare • OCB',img:'../images/hero-puro-tobacco.jpg'}, {id:'bulldak',name:'Bulldak',img:'../images/hero-buldak-ice.jpg'}, {id:'ice',name:'Ice Cups',img:'../images/hero-buldak-ice.jpg'}, {id:'oferta',name:'Oferta',img:'../images/hero-premium-bag.jpg'}, ]; function renderMarketCats(){ const cont=$('#marketCats'); cont.innerHTML=MARKET_CATS.map(c=>{ if(c.isAll) return `<button class="cat-circle all ${activeCat==='all'?'active':''}" data-cat="all"><div class="thumb">TË GJITHA</div><span>Të gjitha</span></button>`; return `<button class="cat-circle ${activeCat===c.id?'active':''}" data-cat="${c.id}"><div class="thumb"><img src="${c.img}" alt="${c.name}"></div><span>${c.name}</span></button>`; }).join(''); cont.querySelectorAll('.cat-circle').forEach(b=>b.addEventListener('click', ()=>{ activeCat=b.dataset.cat; renderMarketCats(); renderMarketGrid(); }));
} function getFiltered(){ let list=[...PRODUCTS]; // Category filter if(activeCat!=='all'){ if(activeCat==='alkool') list=list.filter(p=>p.id.includes('grey')||p.id.includes('jack')||p.brand.includes('Grey')||p.brand.includes('Jack')||p.id.includes('redbull')); else if(activeCat==='cigare') list=list.filter(p=>p.id.includes('puro')||p.id.includes('golden')||p.id.includes('ocb')||p.id.includes('eagle')); else if(activeCat==='ushqime') list=list.filter(p=>p.id.includes('buldak')||p.id.includes('lays')||p.category==='ushqime-pije'); else if(activeCat==='ice') list=list.filter(p=>p.id.includes('ice')||p.name.toLowerCase().includes('ice')); else list=list.filter(p=>p.category===activeCat); } // Filter chips if(activeFilter==='ushqime') list=list.filter(p=>p.category==='ushqime-pije' || p.id.includes('buldak')||p.id.includes('lays')); if(activeFilter==='pije') list=list.filter(p=>p.category==='pije-tonike' && !p.id.includes('puro')&&!p.id.includes('golden')&&!p.id.includes('ocb')&&!p.id.includes('grey')&&!p.id.includes('jack')); if(activeFilter==='embelsira') list=list.filter(p=>p.category==='cokollata-embelsira'); if(activeFilter==='alkool') list=list.filter(p=>p.id.includes('grey')||p.id.includes('jack')||p.id.includes('redbull')); if(activeFilter==='cigare') list=list.filter(p=>p.id.includes('puro')||p.id.includes('golden')||p.id.includes('ocb')||p.id.includes('eagle')); if(activeFilter==='bulldak') list=list.filter(p=>p.id.includes('buldak')); if(activeFilter==='ice') list=list.filter(p=>p.id.includes('ice')); if(activeFilter==='oferta') list=list.filter(p=>p.discount>0); // Search if(searchQ){ const q=searchQ.toLowerCase(); list=list.filter(p=>p.name.toLowerCase().includes(q)||p.brand.toLowerCase().includes(q)); } // Sort const sort=$('#marketSort').value; if(sort==='price-low') list.sort((a,b)=>a.price-b.price); if(sort==='price-high') list.sort((a,b)=>b.price-a.price); if(sort==='name') list.sort((a,b)=>a.name.localeCompare(b.name)); if(sort==='discount') list.sort((a,b)=>(b.discount||0)-(a.discount||0)); return list;
} function renderMarketGrid(){ const grid=$('#marketGrid'); const empty=$('#marketEmpty'); const list=getFiltered(); if(list.length===0){ grid.style.display='none'; empty.style.display='block'; return; } grid.style.display='grid'; empty.style.display='none'; grid.innerHTML=list.map((p,i)=>` <article class="product-card" style="animation-delay:${i*0.03}s"> <div class="product-media"> ${p.discount?`<span class="badge-discount">-${p.discount}%</span>`:''} <img src="../${p.image}" alt="${p.name}" loading="lazy" onerror="this.src='../images/hero-premium-bag.jpg'"> </div> <div class="product-info"> <span class="product-brand">${p.brand}</span> <h3 class="product-name">${p.name}</h3> <div class="product-prices"><span class="price-new gold">${p.price.toFixed(2)}€</span>${p.originalPrice?`<span class="price-old">${p.originalPrice.toFixed(2)}€</span>`:''}</div> <div class="product-foot"><span style="font-size:11px;color:#6B6B76">${p.stock>0?'Në stok':''}</span><button class="add-btn" data-add="${p.id}">🛒</button></div> </div> </article> `).join(''); grid.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click', ()=>{ const id=b.dataset.add; const existing=cart.find(c=>c.id===id); if(existing) existing.qty++; else cart.push({id,qty:1}); localStorage.setItem(LS_CART,JSON.stringify(cart)); updateCartUI(); toast(`${PRODUCTS.find(p=>p.id===id)?.name||'Produkti'} u shtua`); b.animate([{transform:'scale(1)'},{transform:'scale(0.85)'},{transform:'scale(1)'}],{duration:300}); }));
} async function init(){ await initFirebase(); try{ const [products,categories]=await Promise.all([fetchProducts(),fetchCategories()]); PRODUCTS=products; CATEGORIES=categories; }catch{ const local=getLocalData(); PRODUCTS=local.products; CATEGORIES=local.categories; } // Check URL params const params=new URLSearchParams(location.search); const cat=params.get('cat'); if(cat){ if(cat==='duhani') activeCat='cigare'; else if(cat==='alkool') activeCat='alkool'; else if(cat==='ushqime') activeCat='ushqime'; else activeCat=cat; } renderMarketCats(); renderMarketGrid(); updateCartUI(); $('#marketSearch')?.addEventListener('input', e=>{ searchQ=e.target.value; renderMarketGrid(); }); $('#marketSort')?.addEventListener('change', renderMarketGrid); $$('#filterRow .filter-chip').forEach(chip=>{ chip.addEventListener('click', ()=>{ $$('#filterRow .filter-chip').forEach(c=>c.classList.remove('active')); chip.classList.add('active'); activeFilter=chip.dataset.filter; renderMarketGrid(); }); }); $('#cartBtn')?.addEventListener('click', ()=>{ $('#cartDrawer')?.classList.add('open'); $('#drawerBackdrop')?.classList.add('open'); }); $('#marketCartBtn')?.addEventListener('click', ()=>{ $('#cartDrawer')?.classList.add('open'); $('#drawerBackdrop')?.classList.add('open'); }); $$('.close-drawer').forEach(b=>b.addEventListener('click', ()=>{ $('#cartDrawer')?.classList.remove('open'); $('#drawerBackdrop')?.classList.remove('open'); })); $('#drawerBackdrop')?.addEventListener('click', ()=>{ $('#cartDrawer')?.classList.remove('open'); $('#drawerBackdrop')?.classList.remove('open'); });
} document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
