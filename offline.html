<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pa internet — Hana Free Shop</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08080A;color:#F4F1EA;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:24px}
  .mark{width:64px;height:64px;margin:0 auto 18px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#F6E3A8,#D4AF37);color:#1A1200;font:700 34px Georgia,serif}
  h1{font:600 30px Georgia,serif;margin:0 0 8px}
  p{color:#9A9AA3;max-width:34ch;margin:0 auto 22px;line-height:1.55}
  a,button{display:inline-block;padding:13px 26px;border-radius:14px;border:0;background:linear-gradient(135deg,#F6E3A8,#D4AF37);color:#1A1200;font-weight:700;text-decoration:none;font-size:15px;cursor:pointer}
</style>
</head>
<body>
  <div>
    <div class="mark">H</div>
    <h1>Nuk ka internet</h1>
    <p>Kontrollo lidhjen dhe provo përsëri. Shporta jote ruhet në këtë pajisje.</p>
    <button onclick="location.reload()">Provo përsëri</button>
  </div>
</body>
</html>
